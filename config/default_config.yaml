# This is a sample configuration for Hugging Face Accelerate.
# To generate your own configuration, run `accelerate config` in your terminal.
# This sample is configured for a 2-node, 6-GPU (3 per node) setup using FSDP.

compute_environment: LOCAL_MACHINE
distributed_type: FSDP # Or MULTI_GPU, DEEPSPEED
downcast_bf16: 'no'
fsdp_config:
  fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP
  fsdp_backward_prefetch_policy: BACKWARD_PRE
  fsdp_forward_prefetch: false
  fsdp_offload_params: false
  fsdp_sharding_strategy: 1 # 1 for FSDP, 2 for SHARD_GRAD_OP
  fsdp_state_dict_type: FULL_STATE_DICT
  fsdp_sync_module_states: true
  fsdp_use_orig_params: true
gpu_ids: all
machine_rank: 0
main_process_ip: 'YOUR_MAIN_NODE_IP' # <-- IMPORTANT: Replace with the IP of your main node
main_process_port: 29500
main_training_function: main
mixed_precision: 'no' # Or 'fp16', 'bf16'
num_machines: 2
num_processes: 6 # Total number of GPUs (2 nodes * 3 GPUs/node)
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
